name: Build UberDriverApp Bypass rootless

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uberdriver-bypass-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test compatibility metadata transformation
        if: runner.os == 'macOS'
        run: python3 tests/test_metadata.py

      - name: Validate v0.21 deviceData inventory
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'containsString:@"forceupgrade"' Tweak.xm
          grep -q 'containsString:@"forceappupgrade"' Tweak.xm
          grep -q 'containsString:@"minversion"' Tweak.xm
          grep -q 'delivered top-level keys' Tweak.xm
          ! grep -q 'UBStripGoOnlineChecksumFields' Tweak.xm
          grep -q '@"versionchecksum", @"envchecksum"' Tweak.xm
          grep -q '@"envid"' Tweak.xm
          grep -q 'format=%@ value=%@' Tweak.xm
          grep -q 'Go Online deviceData inventory active' Tweak.xm

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.uberdriverbypass"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Version)" = "0.21.0"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/uberdriver-check"
          dylib="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.dylib"
          filter="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.plist"
          test -s "$dylib"
          test -s "$filter"
          python3 - "$filter" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              plistlib.load(f)
          PY

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: v0.21.0
          name: UberDriverApp Bypass iOS 16 v0.21.0
          body: |
            Go Online deviceData compatibility inventory build for Uber Driver 4.527.10000.

            v0.20.0 confirmed the current App Store identity 4.585.10000 still receives HTTP 423 ForceUpgrade. v0.21.0 stops removing versionChecksum and envChecksum so the original values reach the request again, and expands safe deviceData diagnostics to show the compatibility fields being sent.

            This build is diagnostic: it is intended to identify the remaining server-side compatibility signal rather than mask the HTTP 423 response locally.

            Install v0.21.0, respring, fully kill Uber Driver, reopen it and press Go Online once. Then send Documents/UberDriverBypass.log.

          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

