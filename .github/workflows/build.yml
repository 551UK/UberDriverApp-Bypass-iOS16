name: Build UberDriverApp Bypass rootless

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uberdriver-bypass-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test compatibility metadata transformation
        run: python3 tests/test_metadata.py

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.uberdriverbypass"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Version)" = "0.6.0"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/uberdriver-check"
          dylib="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.dylib"
          filter="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.plist"
          test -s "$dylib"
          test -s "$filter"
          xcrun lipo "$dylib" -verify_arch arm64 arm64e
          plutil -lint "$filter"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: v0.6.0
          name: UberDriverApp Bypass iOS 16 v0.6.0
          body: |
            Final Go Online request compatibility candidate for Uber Driver 4.527.10000.

            The v0.5.0 log showed the Cronet hook installed, but the useful diagnostics were drowned out by launch-time logging and the DriverChecks Swift model was not Objective-C-hookable. v0.6.0 hooks Cronet_UrlRequest_InitWithParams at the final native request boundary, rewrites any header value containing the old app/continuous version, rewrites x-uber-device-data there, and applies equal-length compatibility replacement to opaque Uber request bodies including the Go Online / fetch-online-blockers paths. Logging is now focused on those paths. Install v0.6.0, respring, fully kill Uber Driver, reopen it, then attempt Go Online. Documents/UberDriverBypass.log records only compatibility-hook status and targeted request diagnostics.
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

