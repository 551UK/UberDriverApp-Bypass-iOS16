name: Build UberDriverApp Bypass rootless

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uberdriver-bypass-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test compatibility metadata transformation
        if: runner.os == 'macOS'
        run: python3 tests/test_metadata.py

      - name: Validate v0.24 integrity-token diagnostics
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'containsString:@"forceupgrade"' Tweak.xm
          grep -q 'containsString:@"forceappupgrade"' Tweak.xm
          grep -q 'containsString:@"minversion"' Tweak.xm
          grep -q 'delivered top-level keys' Tweak.xm
          ! grep -q 'UBStripGoOnlineChecksumFields' Tweak.xm
          grep -q '@"versionchecksum", @"envchecksum"' Tweak.xm
          grep -q '@"envid"' Tweak.xm
          grep -q 'format=%@ value=%@' Tweak.xm
          grep -q 'integrity-token structure diagnostics active' Tweak.xm
          grep -q 'go-online deviceData inventory count=' Tweak.xm
          grep -q 'go-online blocker detail' Tweak.xm
          grep -q 'UBAttestationPathLabel' Tweak.xm
          grep -q 'attestation JSON keys path=' Tweak.xm
          grep -q 'devices-results' Tweak.xm
          grep -q 'UBInspectIntegrityToken' Tweak.xm
          grep -q 'integrity-token %@ length=' Tweak.xm

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.uberdriverbypass"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Version)" = "0.24.0"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/uberdriver-check"
          dylib="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.dylib"
          filter="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.plist"
          test -s "$dylib"
          test -s "$filter"
          python3 - "$filter" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              plistlib.load(f)
          PY

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: v0.24.0
          name: UberDriverApp Bypass iOS 16 v0.24.0
          body: |
            Integrity-token structure diagnostic build for Uber Driver 4.527.10000.

            v0.23.0 showed that the device attestation flow completes successfully and returns UPSERT_STATUS_COMPLETE plus a fresh clientIntegrityToken, but Go Online still receives ATTESTATION / APP_FORCE_UPGRADE.

            v0.24.0 keeps request behavior unchanged. It inspects clientIntegrityToken only in memory and logs its format, segment count, decoded JSON key names, and a small allowlist of non-sensitive app/version/platform claims. The raw token, signatures, nonces, IDs and credentials are never written to the log.

            Install v0.24.0, respring, fully kill Uber Driver, reopen it, wait a few seconds and press Go Online once. Then send Documents/UberDriverBypass.log.

          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

