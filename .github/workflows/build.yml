name: Build UberDriverApp Bypass rootless

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uberdriver-bypass-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test compatibility metadata transformation
        run: python3 tests/test_metadata.py

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.uberdriverbypass"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Version)" = "0.3.0"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/uberdriver-check"
          dylib="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.dylib"
          filter="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.plist"
          test -s "$dylib"
          test -s "$filter"
          xcrun lipo "$dylib" -verify_arch arm64 arm64e
          plutil -lint "$filter"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UberDriverApp-Bypass-iOS16-v0.3.0
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.3.0
          name: UberDriverApp Bypass iOS 16 v0.3.0
          body: |
            Go Online force-upgrade blocker compatibility candidate for Uber Driver 4.527.10000.

            Targets the blocker that appears when pressing Go Online rather than the app-launch path.

            Filters only force-upgrade entries from decoded online-blocker / driver-check data, including FORCE_UPGRADE, FORCE_APP_UPGRADE and the minVersionUrl + storeUrl version-error shape. Other Required Actions such as documents remain untouched.

            Also attempts to disable Objective-C-visible applicability checks on Uber's ForceUpgradeOnlineBlockerPluginFactory / ForceUpgradeBlockerAdapter and retains the request metadata compatibility rewrite as a fallback.

            Install v0.3.0, respring, fully kill Uber Driver, reopen it and press Go Online. The capped Documents/UberDriverBypass.log records only hook/rewrite status and no account, location or request content.
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

