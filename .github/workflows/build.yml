name: Build UberDriverApp Bypass rootless

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uberdriver-bypass-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test compatibility metadata transformation
        if: runner.os == 'macOS'
        run: python3 tests/test_metadata.py

      - name: Validate v0.17 request identity diagnostics
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'containsString:@"forceupgrade"' Tweak.xm
          grep -q 'containsString:@"forceappupgrade"' Tweak.xm
          grep -q 'containsString:@"minversion"' Tweak.xm
          grep -q 'delivered top-level keys' Tweak.xm

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.uberdriverbypass"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Version)" = "0.17.0"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/uberdriver-check"
          dylib="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.dylib"
          filter="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.plist"
          test -s "$dylib"
          test -s "$filter"
          python3 - "$filter" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              plistlib.load(f)
          PY

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: v0.17.0
          name: UberDriverApp Bypass iOS 16 v0.17.0
          body: |
            Expanded Go Online identity diagnostic build for Uber Driver 4.527.10000.

            v0.16.0 proves x-uber-client-version is already 4.584.10000 at the Foundation network boundary, while the server still returns HTTP 423 with the same ForceUpgrade issue. Its JSON body contains none of the known version keys, so v0.17.0 keeps the existing compatibility/filter behavior and broadens diagnostics only.

            For the Go Online request it logs non-sensitive version/device/build-related header names, version-like JSON key paths, and occurrence counts for the old/new app and continuous-version strings in the raw body. Sensitive names such as authorization, token, cookie, session, signature, UUID, user/driver IDs and location fields are explicitly excluded.

            Install v0.17.0, respring, fully kill Uber Driver, reopen it and press Go Online once. Then send Documents/UberDriverBypass.log.

          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

