name: Build UberDriverApp Bypass rootless

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uberdriver-bypass-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test compatibility metadata transformation
        run: python3 tests/test_metadata.py

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.uberdriverbypass"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Version)" = "0.14.0"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/uberdriver-check"
          dylib="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.dylib"
          filter="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.plist"
          test -s "$dylib"
          test -s "$filter"
          xcrun lipo "$dylib" -verify_arch arm64 arm64e
          plutil -lint "$filter"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: v0.14.0
          name: UberDriverApp Bypass iOS 16 v0.14.0
          body: |
            Extended nested ForceUpgrade marker matching for Uber Driver 4.527.10000.

            The v0.13.0 device log reaches the exact live blocker path at $.data.issues[0].data.subtypeString, but the parent issue is still not removed. That proves the nested subtype is not one of the short exact tokens accepted by the old matcher; it is a longer ForceUpgrade/min-version style value.

            v0.14.0 makes the smallest targeted matcher change. Only inside the already-confirmed nested issue.data type/subtype fields, it now accepts normalized values containing forceupgrade, forceappupgrade or minversion in addition to the existing exact markers. The parent issue is then removed by the existing Foundation response filter before Uber's completion handler receives the JSON. Unrelated issues remain untouched.

            A regression test for the live nested issue-data shape is included.

            Install v0.14.0, respring, fully kill Uber Driver, reopen it and press Go Online once. If the update blocker remains, send Documents/UberDriverBypass.log.

          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

