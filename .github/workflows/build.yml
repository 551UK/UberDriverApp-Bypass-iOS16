name: Build UberDriverApp Bypass rootless

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uberdriver-bypass-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test compatibility metadata transformation
        if: runner.os == 'macOS'
        run: python3 tests/test_metadata.py

      - name: Validate v0.33 request-shape compatibility diagnostics
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'containsString:@"forceupgrade"' Tweak.xm
          grep -q 'containsString:@"forceappupgrade"' Tweak.xm
          grep -q 'containsString:@"minversion"' Tweak.xm
          grep -q 'delivered top-level keys' Tweak.xm
          ! grep -q 'UBStripGoOnlineChecksumFields' Tweak.xm
          grep -q '@"versionchecksum", @"envchecksum"' Tweak.xm
          grep -q '@"envid"' Tweak.xm
          grep -q 'format=%@ value=%@' Tweak.xm
          grep -q 'mode=%@ actualApp=%@ actualOS=%@ targetApp=%@' Tweak.xm
          grep -q 'UBTargetOSVersion = @"18.4"' Tweak.xm
          grep -q 'UBTargetOSBuild = @"22E240"' Tweak.xm
          grep -q 'UBTargetOSBuildHeader = @"Version 18.4 (Build 22E240)"' Tweak.xm
          grep -q 'go-online deviceData comparison presence' Tweak.xm
          grep -q 'header comparison presence x-uber-device-year-class' Tweak.xm
          grep -q 'UBTargetAppVersion = @"4.585.10000"' Tweak.xm
          grep -q 'reference capture mode active' Tweak.xm
          grep -q 'go-online deviceData inventory count=' Tweak.xm
          grep -q 'go-online blocker detail' Tweak.xm
          grep -q 'UBAttestationPathLabel' Tweak.xm
          grep -q 'attestation JSON keys path=' Tweak.xm
          grep -q 'devices-results' Tweak.xm
          grep -q 'UBInspectIntegrityToken' Tweak.xm
          grep -q 'integrity-token %@ length=' Tweak.xm
          grep -q 'segment\[%lu\] encodedChars=%lu decodedBytes=%lu' Tweak.xm
          grep -q 'UBLogAttestationRequestHeaders' Tweak.xm
          grep -q 'header names count=%lu names=%@' Tweak.xm
          grep -q 'Cronet retry after %@s installed=%d' Tweak.xm
          grep -q 'UBNativeCronetHooksInstalled' Tweak.xm
          grep -q 'reference capture response parsed; no response filtering applied' Tweak.xm

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.uberdriverbypass"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Version)" = "0.33.0"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/uberdriver-check"
          dylib="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.dylib"
          filter="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.plist"
          test -s "$dylib"
          test -s "$filter"
          python3 - "$filter" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              plistlib.load(f)
          PY

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: v0.33.0
          name: UberDriverApp Bypass iOS 16 v0.33.0
          body: |
            Reference-identity compatibility build for the old Uber Driver app on rootless iOS 16.

            v0.29.0 confirmed the working reference device is Uber Driver 4.585.10000 on iOS 18.5 and completes the device-attestation flow with UPSERT_STATUS_COMPLETE. The failing iOS 16 profile was still advertising Uber 4.584.10000 and iOS 17.0.

            v0.32.0 keeps the Uber 4.585.10000 / iOS 18.4 compatibility identity from v0.31.0 and adds focused diagnostics for the /rt/devices/task attestation decision.

            It logs only safe request identity headers plus encoded/decoded segment lengths for clientIntegrityToken. Token contents, authorization, cookies, nonces and attestation material remain redacted.

            Run v0.32.0 on the failing iOS 16 device and, if available, the working Uber 4.585 / iOS 18.5 reference device. Send both Documents/UberDriverBypass.log files for comparison.

          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

