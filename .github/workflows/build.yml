name: Build UberDriverApp Bypass rootless

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uberdriver-bypass-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test compatibility metadata transformation
        run: python3 tests/test_metadata.py

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.uberdriverbypass"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Version)" = "0.8.0"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/uberdriver-check"
          dylib="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.dylib"
          filter="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.plist"
          test -s "$dylib"
          test -s "$filter"
          xcrun lipo "$dylib" -verify_arch arm64 arm64e
          plutil -lint "$filter"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: v0.8.0
          name: UberDriverApp Bypass iOS 16 v0.8.0
          body: |
            Local DriverIntegration ForceUpgrade blocker compatibility candidate for Uber Driver 4.527.10000.

            The v0.7.0 log proves the Cronet hooks and upload-body hooks install, but pressing Go Online produces no Cronet final-request or upload-body rewrite diagnostics. That points away from the outgoing request path and toward an already-decoded/local DriverIntegration ForceUpgrade blocker. v0.8.0 therefore inspects the exact ForceUpgradeOnlineBlockerPluginFactory and ForceUpgradeBlockerAdapter runtime classes and safely forces only Objective-C-visible BOOL decision methods with zero arguments or one object argument to return NO. It logs every method name/type it finds so the remaining local blocker path can be identified without the unsafe broad runtime patch used in v0.3.0. Existing iOS 18 and request compatibility hooks remain enabled. Install v0.8.0, respring, fully kill Uber Driver, reopen it and attempt Go Online.

          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

