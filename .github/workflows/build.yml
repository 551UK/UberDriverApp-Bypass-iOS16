name: Build UberDriverApp Bypass rootless

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uberdriver-bypass-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test compatibility metadata transformation
        run: python3 tests/test_metadata.py

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.uberdriverbypass"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Version)" = "0.11.0"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/uberdriver-check"
          dylib="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.dylib"
          filter="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.plist"
          test -s "$dylib"
          test -s "$filter"
          xcrun lipo "$dylib" -verify_arch arm64 arm64e
          plutil -lint "$filter"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: v0.11.0
          name: UberDriverApp Bypass iOS 16 v0.11.0
          body: |
            Foundation transport diagnostic build for Uber Driver 4.527.10000.

            The v0.10.0 device log shows the ForceUpgrade factory and adapter plus their Presidio superclass layers expose no Objective-C methods, so that hook path cannot reach the Swift-native blocker. It also produced no Cronet request path lines. v0.11.0 keeps the existing compatibility behavior and adds narrow NSURLSession diagnostics: Uber requests log only host and path, and the known go-online/fetch-online-blockers completion path logs response byte count, MIME type, error presence, and whether readable text contains an explicit ForceUpgrade/minVersion/storeUrl marker. Query strings, headers, tokens and response contents are not logged.

            Install v0.11.0, respring, fully kill Uber Driver, reopen it, press Go Online once, then send Documents/UberDriverBypass.log.

          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

