name: Build UberDriverApp Bypass rootless

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uberdriver-bypass-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test compatibility metadata transformation
        run: python3 tests/test_metadata.py

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.uberdriverbypass"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Version)" = "0.2.0"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/uberdriver-check"
          dylib="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.dylib"
          filter="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.plist"
          test -s "$dylib"
          test -s "$filter"
          xcrun lipo "$dylib" -verify_arch arm64 arm64e
          plutil -lint "$filter"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UberDriverApp-Bypass-iOS16-v0.2.0
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.2.0
          name: UberDriverApp Bypass iOS 16 v0.2.0
          body: |
            Revised iOS 16 compatibility candidate for Uber Driver 4.527.10000.

            Fixes gaps in v0.1.0: handles serialized JSON (including immutable/nested dictionaries), request bodies, bulk headers, and deviceOSVersion/plain version fields found in the supplied binaries. Removes process-wide mutable dictionary hooks.

            Includes a small privacy-limited Documents/UberDriverBypass.log to confirm injection and whether metadata rewrites execute. Does not log URLs, identifiers, credentials, location or request/response bodies.

            Install over v0.1.0, respring, fully close and reopen Uber Driver. Enable UberDriverBypass injection in Choicy if used.

            Build/package checks are automated. Live server acceptance still requires testing on the device. Document/account requirements remain enforced.
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

