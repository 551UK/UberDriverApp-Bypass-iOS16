name: Build UberDriverApp Bypass rootless

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uberdriver-bypass-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test compatibility metadata transformation
        run: python3 tests/test_metadata.py

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.uberdriverbypass"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Version)" = "0.12.0"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/uberdriver-check"
          dylib="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.dylib"
          filter="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.plist"
          test -s "$dylib"
          test -s "$filter"
          xcrun lipo "$dylib" -verify_arch arm64 arm64e
          plutil -lint "$filter"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: v0.12.0
          name: UberDriverApp Bypass iOS 16 v0.12.0
          body: |
            Direct Foundation Go Online response filtering candidate for Uber Driver 4.527.10000.

            The v0.11.0 device log identifies the real remaining path: /rt/drivers/v2/go-online is sent through Foundation/NSURLSession, returns HTTP data successfully as 488 bytes of application/json, and that JSON contains an explicit ForceUpgrade/minVersion/storeUrl marker. The native Cronet path is not the one carrying this request.

            v0.12.0 therefore applies the existing narrow ForceUpgrade JSON filter directly to the completed Foundation response before Uber's original completion handler receives it. Only explicit force-upgrade blocker objects and force-upgrade boolean gates are changed; unrelated required actions remain untouched. If the 488-byte response contains a ForceUpgrade-shaped JSON structure that the current filter still does not recognize, v0.12.0 logs only the suspicious JSON key paths and value types, not response values or authentication data.

            Install v0.12.0, respring, fully kill Uber Driver, reopen it and press Go Online once. If the update blocker remains, send Documents/UberDriverBypass.log.

          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

