name: Build UberDriverApp Bypass rootless

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uberdriver-bypass-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test compatibility metadata transformation
        run: python3 tests/test_metadata.py

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.uberdriverbypass"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Version)" = "0.13.0"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/uberdriver-check"
          dylib="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.dylib"
          filter="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.plist"
          test -s "$dylib"
          test -s "$filter"
          xcrun lipo "$dylib" -verify_arch arm64 arm64e
          plutil -lint "$filter"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: v0.13.0
          name: UberDriverApp Bypass iOS 16 v0.13.0
          body: |
            Targeted nested ForceUpgrade issue-data filter for Uber Driver 4.527.10000.

            The v0.12.0 device log identifies the exact live JSON shape that escaped the existing filter: the Go Online response contains a ForceUpgrade marker at $.data.issues[0].data.subtypeString. The previous matcher inspected issue-level type/subtype fields but did not treat a nested issue.data subtype as making the parent issue a ForceUpgrade blocker.

            v0.13.0 makes the smallest targeted change: when an issue dictionary contains a nested data dictionary, it checks only typeString, subtypeString, issueType, type and subtype inside that data object. If one of those values is an explicit ForceUpgrade marker, the existing response filter removes that parent issue before Uber's completion handler receives the JSON. All unrelated issue entries remain untouched.

            Install v0.13.0, respring, fully kill Uber Driver, reopen it and press Go Online once. If the update blocker remains, send Documents/UberDriverBypass.log.

          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

