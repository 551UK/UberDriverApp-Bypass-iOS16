name: Build UberDriverApp Bypass rootless

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uberdriver-bypass-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test compatibility metadata transformation
        run: python3 tests/test_metadata.py

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.uberdriverbypass"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Version)" = "0.7.0"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/uberdriver-check"
          dylib="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.dylib"
          filter="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.plist"
          test -s "$dylib"
          test -s "$filter"
          xcrun lipo "$dylib" -verify_arch arm64 arm64e
          plutil -lint "$filter"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: v0.7.0
          name: UberDriverApp Bypass iOS 16 v0.7.0
          body: |
            Cronet upload-body Go Online compatibility candidate for Uber Driver 4.527.10000.

            The v0.6.1 log proves the Cronet hooks load but no targeted Go Online/fetch-online-blockers URL reaches the existing final-request logger, and the Swift DriverChecks getters are not Objective-C-hookable. v0.7.0 therefore targets the remaining place the old app version can travel: Cronet's upload body. It intercepts Cronet UploadDataProvider callbacks, associates each upload sink with its buffer, and immediately before Cronet accepts each completed upload chunk performs only equal-length compatibility replacements (4.527.10000 to 4.584.10000, 273504.1 to 326106.1, and iOS 16.x to the iOS 18 spoof). This preserves protobuf/Thrift lengths. Install v0.7.0, respring, fully kill Uber Driver, reopen it and attempt Go Online.
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

