name: Build UberDriverApp Bypass rootless

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uberdriver-bypass-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test compatibility metadata transformation
        run: python3 tests/test_metadata.py

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.uberdriverbypass"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Version)" = "0.9.0"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/uberdriver-check"
          dylib="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.dylib"
          filter="$RUNNER_TEMP/uberdriver-check/var/jb/Library/MobileSubstrate/DynamicLibraries/UberDriverBypass.plist"
          test -s "$dylib"
          test -s "$filter"
          xcrun lipo "$dylib" -verify_arch arm64 arm64e
          plutil -lint "$filter"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: v0.9.0
          name: UberDriverApp Bypass iOS 16 v0.9.0
          body: |
            Targeted Cronet response-level ForceUpgrade filtering candidate for Uber Driver 4.527.10000.

            The v0.8.0 device log shows the tweak and Cronet upload hooks load, but the exact Objective-C-visible DriverChecks and local ForceUpgrade BOOL hooks both install zero methods. That means the remaining Go Online blocker is not exposed through those Objective-C selectors. v0.9.0 therefore adds a narrow native Cronet response hook only for drivers/v2/go-online and drivers/v2/fetch-online-blockers. When a response chunk is complete JSON, it removes only explicit ForceUpgrade blocker objects or force-upgrade booleans, re-encodes the JSON, and pads the remainder with whitespace so Cronet's original byte count is preserved. Non-JSON/protobuf chunks are left untouched and only logged if they contain a recognizable ForceUpgrade/minVersion/storeUrl marker. Existing iOS 18 request compatibility hooks remain enabled.

            Install v0.9.0, respring, fully kill Uber Driver, reopen it and attempt Go Online. If the update blocker remains, send Documents/UberDriverBypass.log.

          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

